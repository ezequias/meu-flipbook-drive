<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook via Google Drive Link</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body {
            background-color: #1e272e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }
        #selector-container {
            text-align: center;
            background: #2f3640;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 450px;
        }
        input[type="text"] {
            margin-top: 15px;
            padding: 10px;
            width: 90%;
            border-radius: 4px;
            border: none;
            font-size: 1rem;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #e84118;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background: #c23616;
        }
        #loading {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: none;
        }
        #book {
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        .page {
            background-color: white;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Tela de Entrada do Link -->
    <div id="selector-container">
        <h2>Flipbook do Google Drive</h2>
        <p>Cole o link de compartilhamento do seu PDF do Google Drive:</p>
        <input type="text" id="driveUrl" placeholder="Ex: https://drive.google.com/file/d/.../view?usp=sharing">
        <button id="loadBtn">Gerar Flipbook</button>
        <p style="font-size: 0.8rem; color: #a4b0be; margin-top: 15px;">*Certifique-se de que o arquivo no Drive está configurado como "Qualquer pessoa com o link pode visualizar".</p>
    </div>

    <div id="loading">Baixando e renderizando o PDF do Google Drive... Aguarde.</div>
    <div id="book"></div>

    <script>
        const driveUrlInput = document.getElementById('driveUrl');
        const loadBtn = document.getElementById('loadBtn');
        const selectorContainer = document.getElementById('selector-container');
        const loadingDiv = document.getElementById('loading');
        const bookContainer = document.getElementById('book');

        loadBtn.addEventListener('click', async function() {
            const urlValue = driveUrlInput.value.trim();
            if (!urlValue) {
                alert('Por favor, insira o link do arquivo.');
                return;
            }

            selectorContainer.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                // Passa pelo proxy local do Python para evitar problemas de CORS do Google Drive
                const proxyUrl = `/api/proxy-drive?url=${encodeURIComponent(urlValue)}`;
                
                const loadingTask = pdfjsLib.getDocument(proxyUrl);
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.5 });

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    pageDiv.appendChild(canvas);
                    bookContainer.appendChild(pageDiv);
                }

                loadingDiv.style.display = 'none';
                bookContainer.style.display = 'block';

                const flipBook = new St.PageFlip(bookContainer, {
                    width: 500,
                    height: 700,
                    showCover: true,
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: false
                });

                flipBook.loadFromHTML(bookContainer.querySelectorAll('.page'));

            } catch (error) {
                console.error('Erro ao processar o PDF:', error);
                loadingDiv.innerText = 'Erro ao carregar o PDF. Verifique se o link está correto e se o arquivo está público no Drive.';
            }
        });
    </script>

</body>
</html>
